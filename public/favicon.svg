<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Rounded Container -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="2"/>
  
  <!-- Outer subtle ring -->
  <rect x="6" y="6" width="52" height="52" rx="12" fill="none" stroke="url(#amberGrad)" stroke-width="1.5" stroke-dasharray="4 2" opacity="0.4"/>

  <!-- Microphone Icon -->
  <rect x="26" y="16" width="12" height="20" rx="6" fill="url(#amberGrad)" filter="url(#glow)"/>
  <path d="M20 28C20 34.6274 25.3726 40 32 40C38.6274 40 44 34.6274 44 28" stroke="url(#amberGrad)" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M32 40V48M25 48H39" stroke="url(#amberGrad)" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Sparkle dots -->
  <circle cx="16" cy="18" r="2" fill="#fbbf24"/>
  <circle cx="48" cy="18" r="1.5" fill="#fef08a"/>
</svg>
